[project]
name = "bank-widget"
version = "0.1.0"
description = ""
authors = [
    {name = "Tatyana"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.poetry]
packages = [
    { include = "src", from = "." },
    { include = "tests", from = "." },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.2.0"
black = "^25.1.0"
isort = "^6.0.1"
mypy = "^1.15.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^5.0.0"
pytest-mock = "^3.12.0"
types-pyyaml = "^6.0.12"
pre-commit = "^3.7.0"

[tool.black]
line-length = 119
exclude = '''
.git
'''

[tool.isort]
line_length = 119
multi_line_output = 3
include_trailing_comma = true
known_first_party = ["src"]
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"

[tool.pytest.ini_options]
addopts = "--verbose --cov=src --cov-report term --cov-report html:htmlcov"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.coverage.run]
source = ["src"]
omit = ["**/__init__.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:"
]

[tool.taskipy.tasks]
test = "pytest --cov=src --cov-report term-missing"
lint = "flake8 src tests && mypy src tests && black --check src tests && isort --check-only src tests"
format = "black src tests && isort src tests"
