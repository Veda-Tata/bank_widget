[tool.poetry]
name = "bank-widget"
version = "0.1.0"
description = ""
authors = ["Tatyana <tatyana@example.com>"]
readme = "README.md"
packages = [
    { include = "src", from = "." },
    { include = "tests", from = "." },
]

[tool.poetry.dependencies]
python = "^3.8"
pandas = "^2.0.0"
openpyxl = "^3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.2.0"
black = "^25.1.0"
isort = "^6.0.1"
mypy = "^1.15.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '''
.git
'''

[tool.isort]
line_length = 119
multi_line_output = 3
include_trailing_comma = true
known_first_party = ["src"]
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"
